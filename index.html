<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caderno de Redação</title>
<style>
:root{
  --bg:#f6efe5;--paper:#fffaf3;--paper2:#f1e4d2;--brown:#6f4e37;--brown2:#8a6548;
  --text:#3e3027;--muted:#8b7868;--line:#e5d6c3;--accent:#b58a67;--green:#78856d;
  --shadow:0 10px 30px rgba(78,55,39,.08);--radius:18px;
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit} button{cursor:pointer}
.app{display:flex;min-height:100vh}.sidebar{width:250px;background:#eadbc8;padding:26px 16px;position:fixed;inset:0 auto 0 0;z-index:5}
.logo{font-family:Georgia,serif;font-size:25px;font-weight:700;color:var(--brown);padding:5px 12px 25px}.logo small{display:block;font:12px system-ui;color:var(--muted);margin-top:5px}
.nav button{display:flex;width:100%;border:0;background:transparent;color:var(--text);padding:12px 14px;border-radius:12px;text-align:left;gap:11px;margin:4px 0;font-weight:600}
.nav button.active,.nav button:hover{background:rgba(255,250,243,.72);color:var(--brown)}
.sidebar-bottom{position:absolute;bottom:22px;left:16px;right:16px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:700;background:var(--brown);color:#fff}.btn.secondary{background:var(--paper2);color:var(--brown)}.btn.danger{background:#a66c5e}
.main{margin-left:250px;width:calc(100% - 250px);padding:34px;max-width:1500px}
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:25px}.title{font:700 34px Georgia,serif;margin:0;color:var(--brown)}.subtitle{color:var(--muted);margin:7px 0 0}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.stat{font-size:30px;font-weight:800;color:var(--brown)}.label{font-size:13px;color:var(--muted);margin-top:5px}
.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:18px;margin-top:18px}.section-title{font:700 20px Georgia,serif;margin:0 0 15px}
.list{display:grid;gap:10px}.item{background:#fffdf8;border:1px solid var(--line);padding:14px;border-radius:13px;display:flex;justify-content:space-between;gap:15px;align-items:center}.item strong{display:block}.item small{color:var(--muted)}
.tag{display:inline-block;background:var(--paper2);color:var(--brown);font-size:12px;padding:5px 8px;border-radius:99px;margin:3px 3px 0 0}
.searchbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}.searchbar input,.searchbar select,.field input,.field select,.field textarea{border:1px solid var(--line);background:#fffdf8;color:var(--text);border-radius:11px;padding:11px 12px;outline:none}.searchbar input{flex:1;min-width:220px}
.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:15px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700;color:var(--brown)}.field textarea{min-height:130px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:7px}.checks label{background:var(--paper2);padding:7px 9px;border-radius:9px;font-size:12px;cursor:pointer}.checks input{accent-color:var(--brown)}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.empty{text-align:center;padding:35px;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.modal{position:fixed;inset:0;background:rgba(55,40,30,.35);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.modalbox{background:var(--paper);width:min(820px,100%);max-height:90vh;overflow:auto;border-radius:22px;padding:25px;box-shadow:0 25px 60px rgba(50,30,20,.2)}
.close{float:right;border:0;background:var(--paper2);border-radius:50%;width:34px;height:34px;color:var(--brown);font-size:18px}
.bar{height:9px;background:var(--paper2);border-radius:99px;overflow:hidden;margin:7px 0 14px}.bar span{display:block;height:100%;background:var(--brown2);border-radius:99px}
.note{font-size:28px;font-weight:800;color:var(--brown)}.muted{color:var(--muted)}.back{margin-bottom:15px}.prose{white-space:pre-wrap;line-height:1.65;background:#fffdf8;border:1px solid var(--line);border-radius:12px;padding:15px}
@media(max-width:900px){.sidebar{width:72px;padding:18px 9px}.logo{font-size:0;text-align:center}.logo:first-letter{font-size:25px}.logo small{display:none}.nav button{justify-content:center;font-size:0}.nav button span{font-size:21px}.sidebar-bottom{display:none}.main{margin-left:72px;width:calc(100% - 72px);padding:20px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
@media(max-width:600px){.main{padding:15px}.header{display:block}.title{font-size:28px}.cards{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.btn{padding:9px 11px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo">✒ Caderno<small>Seu laboratório de redação</small></div>
  <nav class="nav">
    <button data-page="dashboard" class="active"><span>⌂</span> Dashboard</button>
    <button data-page="repertorios"><span>📚</span> Repertórios</button>
    <button data-page="redacoes"><span>✍</span> Redações</button>
    <button data-page="temas"><span>🏷</span> Temas & eixos</button>
    <button data-page="temasEscrever"><span>📝</span> Temas p/ escrever</button>
  </nav>
  <div class="sidebar-bottom"><input type="file" id="importFile" accept="application/json" style="display:none" onchange="importBackup(event)"><button class="btn secondary" style="width:100%;margin-bottom:8px" onclick="document.getElementById('importFile').click()">⬆ Importar backup</button><button class="btn secondary" style="width:100%" onclick="backup()">⬇ Backup</button></div>
</aside>
<main class="main" id="main"></main>
</div>

<div class="modal" id="modal"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>

<script>
const KEY='caderno_redacao_v1';
const axes=['Educação','Saúde','Tecnologia','Direitos e cidadania','Grupos vulneráveis','Meio ambiente','Arte e cultura','Economia','Mídia e sociedade','Trabalho','Urbanização','Desigualdade'];
const types=['Livro','Filme','Série','Música','Documentário','Conceito','Filósofo / sociólogo','Evento histórico','Lei / Constituição','Instituição / organização','Dado / estatística','Outro'];
let db=JSON.parse(localStorage.getItem(KEY)||'{"repertorios":[],"redacoes":[]}');
db.bancoTemas=db.bancoTemas||[];
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function tags(a=[]){return a.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}
function avg(){let a=db.redacoes.map(x=>+x.nota).filter(x=>x>0);return a.length?(a.reduce((a,b)=>a+b,0)/a.length).toFixed(0):'—'}
function openModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function nav(page){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));({dashboard:renderDashboard,repertorios:renderRepertorios,redacoes:renderRedacoes,temas:renderTemas,temasEscrever:renderTemasEscrever}[page])()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>nav(b.dataset.page));

function renderDashboard(){
let recent=[...db.redacoes].sort((a,b)=>b.data.localeCompare(a.data)).slice(0,5);
let top=db.repertorios.map(r=>({r,n:db.redacoes.filter(x=>(x.repertorios||[]).includes(r.id)).length})).sort((a,b)=>b.n-a.n).slice(0,5);
document.getElementById('main').innerHTML=`
<div class="header"><div><h1 class="title">Olá! Vamos construir repertório.</h1><p class="subtitle">Seu espaço para estudar, escrever e acompanhar sua evolução.</p></div><button class="btn" onclick="showRepForm()">+ Novo repertório</button></div>
<div class="cards">
<div class="card"><div class="stat">${db.repertorios.length}</div><div class="label">Repertórios cadastrados</div></div>
<div class="card"><div class="stat">${db.repertorios.filter(x=>x.dominio==='Dominado').length}</div><div class="label">Repertórios dominados</div></div>
<div class="card"><div class="stat">${db.redacoes.length}</div><div class="label">Redações registradas</div></div>
<div class="card"><div class="stat">${avg()}</div><div class="label">Média das notas</div></div>
<div class="card"><div class="stat">${db.bancoTemas.length}</div><div class="label">Temas p/ escrever</div></div>
</div>
<div class="grid">
<div class="card"><h2 class="section-title">✍ Redações recentes</h2><div class="list">${recent.length?recent.map(r=>`<div class="item" onclick="viewEssay('${r.id}')" style="cursor:pointer"><div><strong>${esc(r.tema)}</strong><small>${esc(r.data||'')} · ${r.nota?esc(r.nota)+' pontos':'Sem nota'}</small></div><span>›</span></div>`).join(''):'<div class="empty">Ainda não há redações cadastradas.</div>'}</div></div>
<div class="card"><h2 class="section-title">📚 Mais utilizados</h2><div class="list">${top.filter(x=>x.n).length?top.filter(x=>x.n).map(x=>`<div class="item"><div><strong>${esc(x.r.nome)}</strong><small>${x.n} redação(ões)</small></div></div>`).join(''):'<div class="empty">Use seus repertórios nas redações para ver dados aqui.</div>'}</div></div>
</div>`;
}
function showRepForm(id){
let r=db.repertorios.find(x=>x.id===id)||{nome:'',tipo:'Livro',autor:'',ano:'',explicacao:'',aplicacao:'',eixos:[],palavras:'',dominio:'Não estudado'};
openModal(`<h2 class="section-title">${id?'Editar':'Novo'} repertório</h2><form class="form" onsubmit="event.preventDefault();saveRep('${id||''}')">
<div class="field"><label>Nome do repertório</label><input id="rn" required value="${esc(r.nome)}"></div>
<div class="field"><label>Tipo da obra</label><select id="rt">${types.map(x=>`<option ${x===r.tipo?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="field"><label>Autor / criador</label><input id="ra" value="${esc(r.autor)}"></div>
<div class="field"><label>Ano (opcional)</label><input id="ry" value="${esc(r.ano)}"></div>
<div class="field full"><label>Explicação do repertório</label><textarea id="re">${esc(r.explicacao)}</textarea></div>
<div class="field full"><label>Exemplo de aplicação na redação</label><textarea id="rap">${esc(r.aplicacao)}</textarea></div>
<div class="field full"><label>Eixos temáticos</label><div class="checks">${axes.map(a=>`<label><input type="checkbox" value="${esc(a)}" ${r.eixos?.includes(a)?'checked':''}> ${esc(a)}</label>`).join('')}</div></div>
<div class="field"><label>Palavras-chave</label><input id="rp" placeholder="ex.: redes sociais, consumo, mídia" value="${esc(r.palavras)}"></div>
<div class="field"><label>Domínio</label><select id="rd">${['Não estudado','Estudando','Dominado'].map(x=>`<option ${x===r.dominio?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="field full actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn">Salvar repertório</button></div></form>`);
}
function saveRep(id){
let r=db.repertorios.find(x=>x.id===id);if(!r){r={id:crypto.randomUUID()};db.repertorios.push(r)}
Object.assign(r,{nome:rn.value,tipo:rt.value,autor:ra.value,ano:ry.value,explicacao:re.value,aplicacao:rap.value,eixos:[...document.querySelectorAll('#modalContent .checks input:checked')].map(x=>x.value),palavras:rp.value,dominio:rd.value});
save();closeModal();renderRepertorios();
}
function renderRepertorios(){
document.getElementById('main').innerHTML=`<div class="header"><div><h1 class="title">Repertórios</h1><p class="subtitle">Organize referências e descubra onde cada uma pode ser aplicada.</p></div><button class="btn" onclick="showRepForm()">+ Novo repertório</button></div>
<div class="card"><div class="searchbar"><input id="repSearch" placeholder="🔎 Pesquisar por nome, autor ou palavra-chave..." oninput="filterRep()"><select id="repType" onchange="filterRep()"><option>Todos os tipos</option>${types.map(x=>`<option>${x}</option>`).join('')}</select><select id="repAxis" onchange="filterRep()"><option>Todos os eixos</option>${axes.map(x=>`<option>${x}</option>`).join('')}</select><select id="repDom" onchange="filterRep()"><option>Todos os níveis</option><option>Não estudado</option><option>Estudando</option><option>Dominado</option></select></div><div id="repList"></div></div>`;filterRep()
}
function filterRep(){
let q=(repSearch?.value||'').toLowerCase(),t=repType?.value,a=repAxis?.value,d=repDom?.value;
let arr=db.repertorios.filter(r=>(!q||[r.nome,r.autor,r.palavras].join(' ').toLowerCase().includes(q))&&(!t||t==='Todos os tipos'||r.tipo===t)&&(!a||a==='Todos os eixos'||r.eixos?.includes(a))&&(!d||d==='Todos os níveis'||r.dominio===d));
document.getElementById('repList').innerHTML=arr.length?`<div class="list">${arr.map(r=>`<div class="item"><div style="flex:1;cursor:pointer" onclick="viewRep('${r.id}')"><strong>${esc(r.nome)}</strong><small>${esc(r.tipo)}${r.autor?' · '+esc(r.autor):''} · ${esc(r.dominio)}</small><div>${tags(r.eixos)}</div></div><button class="btn secondary" onclick="showRepForm('${r.id}')">Editar</button><button class="btn danger" onclick="deleteRep('${r.id}')">×</button></div>`).join('')}</div>`:'<div class="empty">Nenhum repertório encontrado.</div>'
}
function viewRep(id){
let r=db.repertorios.find(x=>x.id===id), essays=db.redacoes.filter(x=>(x.repertorios||[]).includes(id)), temasRel=db.bancoTemas.filter(x=>(x.repertorios||[]).includes(id));
openModal(`<h1 class="title" style="font-size:28px">${esc(r.nome)}</h1><p class="muted">${esc(r.tipo)}${r.autor?' · '+esc(r.autor):''}${r.ano?' · '+esc(r.ano):''}</p><p>${tags(r.eixos)}</p><h3>Explicação</h3><div class="prose">${esc(r.explicacao)||'—'}</div><h3>Exemplo de aplicação</h3><div class="prose">${esc(r.aplicacao)||'—'}</div><h3>Temas de redação relacionados</h3>${temasRel.length?`<div class="list">${temasRel.map(t=>`<div class="item" onclick="closeModal();viewTema('${t.id}')" style="cursor:pointer"><div><strong>${esc(t.titulo)}</strong><small>${esc(t.status||'')}</small></div>›</div>`).join('')}</div>`:'<p class="muted">Nenhum tema cadastrado usa este repertório ainda.</p>'}<h3>Redações em que foi utilizado</h3>${essays.length?`<div class="list">${essays.map(e=>`<div class="item" onclick="closeModal();viewEssay('${e.id}')" style="cursor:pointer"><div><strong>${esc(e.tema)}</strong><small>${esc(e.data)} · ${e.nota?esc(e.nota):'Sem nota'}</small></div>›</div>`).join('')}</div>`:'<p class="muted">Você ainda não utilizou este repertório em nenhuma redação.</p>'}`)
}
function deleteRep(id){if(confirm('Excluir este repertório? Ele também será removido dos vínculos com redações.')){db.repertorios=db.repertorios.filter(x=>x.id!==id);db.redacoes.forEach(r=>r.repertorios=(r.repertorios||[]).filter(x=>x!==id));save();renderRepertorios()}}
function showEssayForm(id,presetTema=''){
let r=db.redacoes.find(x=>x.id===id)||{tema:presetTema,data:new Date().toISOString().slice(0,10),texto:'',nota:'',c1:'',c2:'',c3:'',c4:'',c5:'',repertorios:[],melhorias:'',sugestoes:'',correcoes:''};
openModal(`<h2 class="section-title">${id?'Editar':'Nova'} redação</h2><form class="form" onsubmit="event.preventDefault();saveEssay('${id||''}')">
<div class="field full"><label>Tema</label><input id="et" required value="${esc(r.tema)}"></div><div class="field"><label>Data</label><input type="date" id="ed" value="${esc(r.data)}"></div><div class="field"><label>Nota final</label><input type="number" id="en" min="0" max="1000" step="10" value="${esc(r.nota)}"></div>
<div class="field full"><label>Texto completo</label><textarea id="ex" style="min-height:280px">${esc(r.texto)}</textarea></div>
<div class="field full"><label>Repertórios utilizados</label><div class="checks">${db.repertorios.map(x=>`<label><input type="checkbox" value="${x.id}" ${r.repertorios?.includes(x.id)?'checked':''}> ${esc(x.nome)}</label>`).join('')||'<span class="muted">Cadastre repertórios primeiro.</span>'}</div></div>
${['c1','c2','c3','c4','c5'].map((c,i)=>`<div class="field"><label>Competência ${i+1}</label><input type="number" id="${c}" min="0" max="200" step="40" value="${esc(r[c])}"></div>`).join('')}
<div class="field full"><label>Correções</label><textarea id="ec">${esc(r.correcoes)}</textarea></div><div class="field full"><label>Pontos de melhoria</label><textarea id="em">${esc(r.melhorias)}</textarea></div><div class="field full"><label>Sugestões</label><textarea id="es">${esc(r.sugestoes)}</textarea></div>
<div class="field full actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn">Salvar redação</button></div></form>`);
}
function saveEssay(id){
let r=db.redacoes.find(x=>x.id===id);if(!r){r={id:crypto.randomUUID()};db.redacoes.push(r)}
Object.assign(r,{tema:et.value,data:ed.value,texto:ex.value,nota:en.value,c1:c1.value,c2:c2.value,c3:c3.value,c4:c4.value,c5:c5.value,repertorios:[...document.querySelectorAll('#modalContent .checks input:checked')].map(x=>x.value),correcoes:ec.value,melhorias:em.value,sugestoes:es.value});save();closeModal();renderRedacoes()
}
function renderRedacoes(){
let arr=[...db.redacoes].sort((a,b)=>b.data.localeCompare(a.data));
document.getElementById('main').innerHTML=`<div class="header"><div><h1 class="title">Minhas redações</h1><p class="subtitle">Registre suas produções e acompanhe seus pontos de melhoria.</p></div><button class="btn" onclick="showEssayForm()">+ Nova redação</button></div><div class="card"><div class="searchbar"><input id="essaySearch" placeholder="🔎 Buscar por tema..." oninput="filterEssays()"></div><div id="essayList"></div></div>`;filterEssays()
}
function filterEssays(){
let q=(essaySearch?.value||'').toLowerCase(),arr=db.redacoes.filter(r=>r.tema.toLowerCase().includes(q)).sort((a,b)=>b.data.localeCompare(a.data));
document.getElementById('essayList').innerHTML=arr.length?`<div class="list">${arr.map(r=>`<div class="item"><div style="flex:1;cursor:pointer" onclick="viewEssay('${r.id}')"><strong>${esc(r.tema)}</strong><small>${esc(r.data)} · ${r.nota?esc(r.nota)+' / 1000':'Sem nota'}</small><div>${(r.repertorios||[]).map(id=>{let x=db.repertorios.find(a=>a.id===id);return x?`<span class="tag">${esc(x.nome)}</span>`:''}).join('')}</div></div><button class="btn secondary" onclick="showEssayForm('${r.id}')">Editar</button><button class="btn danger" onclick="deleteEssay('${r.id}')">×</button></div>`).join('')}</div>`:'<div class="empty">Nenhuma redação encontrada.</div>'
}
function viewEssay(id){
let r=db.redacoes.find(x=>x.id===id), comps=[r.c1,r.c2,r.c3,r.c4,r.c5];
openModal(`<h1 class="title" style="font-size:28px">${esc(r.tema)}</h1><p class="muted">${esc(r.data)}</p>${r.nota?`<div class="note">${esc(r.nota)} / 1000</div>`:''}<h3>Repertórios utilizados</h3><div>${(r.repertorios||[]).map(id=>{let x=db.repertorios.find(a=>a.id===id);return x?`<span class="tag" style="cursor:pointer" onclick="viewRep('${x.id}')">${esc(x.nome)}</span>`:''}).join('')||'<span class="muted">Nenhum</span>'}</div><h3>Competências</h3>${comps.map((v,i)=>`<div><small>C${i+1}: ${v||0}/200</small><div class="bar"><span style="width:${Math.min(100,(+v||0)/2)}%"></span></div></div>`).join('')}<h3>Texto</h3><div class="prose">${esc(r.texto)||'—'}</div><h3>Correções</h3><div class="prose">${esc(r.correcoes)||'—'}</div><h3>Pontos de melhoria</h3><div class="prose">${esc(r.melhorias)||'—'}</div><h3>Sugestões</h3><div class="prose">${esc(r.sugestoes)||'—'}</div>`)
}
function deleteEssay(id){if(confirm('Excluir esta redação?')){db.redacoes=db.redacoes.filter(x=>x.id!==id);save();renderRedacoes()}}
function renderTemas(){
let counts=Object.fromEntries(axes.map(a=>[a,0]));db.repertorios.forEach(r=>(r.eixos||[]).forEach(a=>counts[a]++));
document.getElementById('main').innerHTML=`<div class="header"><div><h1 class="title">Temas & eixos</h1><p class="subtitle">Veja como seu banco de repertórios está distribuído.</p></div></div><div class="cards">${axes.map(a=>`<div class="card"><div class="stat">${counts[a]}</div><div class="label">${esc(a)}</div></div>`).join('')}</div><div class="card" style="margin-top:18px"><h2 class="section-title">Dica de organização</h2><p class="muted">Um repertório pode pertencer a vários eixos. Isso permite encontrar referências versáteis para diferentes propostas de redação.</p></div>`
}
function showTemaForm(id){
let t=db.bancoTemas.find(x=>x.id===id)||{titulo:'',eixo:'',enunciado:'',repertorios:[],observacoes:'',status:'Para escrever'};
openModal(`<h2 class="section-title">${id?'Editar':'Novo'} tema de redação</h2><form class="form" onsubmit="event.preventDefault();saveTema('${id||''}')">
<div class="field full"><label>Tema</label><input id="tt" required placeholder="ex.: Os desafios da inclusão digital no Brasil" value="${esc(t.titulo)}"></div>
<div class="field"><label>Eixo temático</label><select id="teix"><option value="">Sem eixo definido</option>${axes.map(x=>`<option ${x===t.eixo?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="field"><label>Status</label><select id="tst">${['Para escrever','Escrito'].map(x=>`<option ${x===t.status?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="field full"><label>Enunciado / contextualização (opcional)</label><textarea id="ten" placeholder="Cole aqui a proposta, textos motivadores ou um resumo do tema">${esc(t.enunciado)}</textarea></div>
<div class="field full"><label>Repertórios relacionados</label><div class="checks">${db.repertorios.map(x=>`<label><input type="checkbox" value="${x.id}" ${t.repertorios?.includes(x.id)?'checked':''}> ${esc(x.nome)}</label>`).join('')||'<span class="muted">Cadastre repertórios primeiro para poder relacioná-los.</span>'}</div></div>
<div class="field full"><label>Observações</label><textarea id="tob" placeholder="Ideias de argumentos, possíveis recortes, o que prestar atenção...">${esc(t.observacoes)}</textarea></div>
<div class="field full actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn">Salvar tema</button></div></form>`);
}
function saveTema(id){
let t=db.bancoTemas.find(x=>x.id===id);if(!t){t={id:crypto.randomUUID()};db.bancoTemas.push(t)}
Object.assign(t,{titulo:tt.value,eixo:teix.value,status:tst.value,enunciado:ten.value,repertorios:[...document.querySelectorAll('#modalContent .checks input:checked')].map(x=>x.value),observacoes:tob.value});
save();closeModal();renderTemasEscrever();
}
function renderTemasEscrever(){
document.getElementById('main').innerHTML=`<div class="header"><div><h1 class="title">Temas para escrever</h1><p class="subtitle">Registre propostas de redação, relacione repertórios e anote observações antes de escrever.</p></div><button class="btn" onclick="showTemaForm()">+ Novo tema</button></div>
<div class="card"><div class="searchbar"><input id="temaSearch" placeholder="🔎 Pesquisar por tema..." oninput="filterTemasEscrever()"><select id="temaEixo" onchange="filterTemasEscrever()"><option>Todos os eixos</option>${axes.map(x=>`<option>${x}</option>`).join('')}</select><select id="temaStatus" onchange="filterTemasEscrever()"><option>Todos os status</option><option>Para escrever</option><option>Escrito</option></select></div><div id="temaList"></div></div>`;filterTemasEscrever()
}
function filterTemasEscrever(){
let q=(temaSearch?.value||'').toLowerCase(),e=temaEixo?.value,s=temaStatus?.value;
let arr=db.bancoTemas.filter(t=>(!q||t.titulo.toLowerCase().includes(q))&&(!e||e==='Todos os eixos'||t.eixo===e)&&(!s||s==='Todos os status'||t.status===s));
document.getElementById('temaList').innerHTML=arr.length?`<div class="list">${arr.map(t=>`<div class="item"><div style="flex:1;cursor:pointer" onclick="viewTema('${t.id}')"><strong>${esc(t.titulo)}</strong><small>${t.eixo?esc(t.eixo)+' · ':''}${esc(t.status)}</small><div>${(t.repertorios||[]).map(id=>{let x=db.repertorios.find(a=>a.id===id);return x?`<span class="tag">${esc(x.nome)}</span>`:''}).join('')}</div></div><button class="btn secondary" onclick="showTemaForm('${t.id}')">Editar</button><button class="btn danger" onclick="deleteTema('${t.id}')">×</button></div>`).join('')}</div>`:'<div class="empty">Nenhum tema cadastrado ainda.</div>'
}
function viewTema(id){
let t=db.bancoTemas.find(x=>x.id===id);
openModal(`<h1 class="title" style="font-size:28px">${esc(t.titulo)}</h1><p class="muted">${t.eixo?esc(t.eixo)+' · ':''}${esc(t.status)}</p><h3>Enunciado / contextualização</h3><div class="prose">${esc(t.enunciado)||'—'}</div><h3>Repertórios relacionados</h3><div>${(t.repertorios||[]).map(id=>{let x=db.repertorios.find(a=>a.id===id);return x?`<span class="tag" style="cursor:pointer" onclick="viewRep('${x.id}')">${esc(x.nome)}</span>`:''}).join('')||'<span class="muted">Nenhum repertório relacionado ainda.</span>'}</div><h3>Observações</h3><div class="prose">${esc(t.observacoes)||'—'}</div><div class="actions" style="justify-content:flex-start;margin-top:18px"><button class="btn" onclick="closeModal();startEssayFromTema('${t.id}')">✍ Escrever redação sobre este tema</button></div>`)
}
function startEssayFromTema(id){let t=db.bancoTemas.find(x=>x.id===id);showEssayForm('',t?.titulo||'')}
function deleteTema(id){if(confirm('Excluir este tema?')){db.bancoTemas=db.bancoTemas.filter(x=>x.id!==id);save();renderTemasEscrever()}}
function importBackup(event){
let file=event.target.files[0];if(!file)return;
let reader=new FileReader();
reader.onload=e=>{
try{
let data=JSON.parse(e.target.result);
if(!data||!Array.isArray(data.repertorios)||!Array.isArray(data.redacoes)){alert('Arquivo inválido: não parece ser um backup do Caderno de Redação.');return}
if(!confirm(`Importar este backup?\n\n${data.repertorios.length} repertório(s) e ${data.redacoes.length} redação(ões) serão mesclados com os dados já existentes (itens com o mesmo ID serão atualizados).`))return;
data.repertorios.forEach(r=>{let i=db.repertorios.findIndex(x=>x.id===r.id);if(i>-1)db.repertorios[i]=r;else db.repertorios.push(r)});
data.redacoes.forEach(r=>{let i=db.redacoes.findIndex(x=>x.id===r.id);if(i>-1)db.redacoes[i]=r;else db.redacoes.push(r)});
(data.bancoTemas||[]).forEach(t=>{let i=db.bancoTemas.findIndex(x=>x.id===t.id);if(i>-1)db.bancoTemas[i]=t;else db.bancoTemas.push(t)});
save();nav('dashboard');
alert('Backup importado com sucesso!');
}catch(err){alert('Não foi possível ler o arquivo. Verifique se é um JSON de backup válido.')}
};
reader.readAsText(file);
event.target.value='';
}
function backup(){
let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='caderno-redacao-backup.json';a.click();URL.revokeObjectURL(a.href)
}
renderDashboard();
</script>
</body>
</html>
